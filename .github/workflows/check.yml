name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Check races
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install -ldflags '-X main.version=ci' ./cmd/ask-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install -ldflags '-H=windowsgui' ./cmd/ask-ai-shortcut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ASK_AI_CONFIG = Join-Path $env:RUNNER_TEMP 'ask-ai-config.json'
          $binary = Join-Path (go env GOPATH) 'bin/ask-ai.exe'
          & $binary -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary provider claude
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary provider gemini
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary provider current
          exit $LASTEXITCODE
